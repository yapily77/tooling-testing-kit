[pytest]
# infra/pytest.ini — async-only support for param_flows/ in-kit async tests.
# NOT the cloner entry point. Cloner default is `uv run pytest` which reads
# pyproject.toml's [tool.pytest.ini_options] (testpaths=["examples"], the
# 0[1-9]_*.py glob, addopts=-q) AND kit-tests/conftest.py (collect_ignore for
# the 10 baziforecaster-only dirs + the KIT_* bridge). Using `-c infra/pytest.ini`
# deliberately restricts to asyncio_mode + the marker set below; it does NOT
# override testpaths so it never reaches the 10 ignored dirs.
asyncio_mode = auto
markers =
    live: marks tests requiring a running Node bazi-mcp server
    e2e: marks tests end-to-end tests requiring a running Telegram bot
    unit: marks fast unit tests
    integration: marks integration tests
