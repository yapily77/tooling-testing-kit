name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run Hygiene Scanners
        run: |
          python hygiene/scanners/run_all.py --scripts

      - name: Run Tools Test Suite
        run: |
          python tools/test/run_all.py

      - name: Run Pytest Test Suite
        run: |
          pytest tests/examples/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build & Lint TypeScript Plugins + Demos
        run: |
          # plugins/typescript/clean_ts
          cd plugins/typescript/clean_ts
          npm ci
          npx tsc --strict --noEmit
          npx eslint src/**/*.ts
          cd ../../../..

          # demo/opencode/typescript
          cd demo/opencode/typescript
          npm ci
          npx tsc --strict --noEmit
