[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clean-py"
version = "1.0.0"
description = "Standalone Python validator porting clean_python.ts logic"
requires-python = ">=3.11"

[project.scripts]
clean_py = "clean_py.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["clean_py"]

[tool.ruff.lint.per-file-ignores]
"**/.*tmp*" = ["N999"]
