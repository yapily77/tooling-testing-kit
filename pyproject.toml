[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tooling-testing-kit"
version = "0.1.0"
description = "Enterprise-grade AI Engineering, Static Analysis, and Harness Testing Toolkit for Python Workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Acivar Digital" }
]
keywords = [
    "static-analysis", "code-hygiene", "harness-testing", "ai-engineering",
    "pydantic", "ast-refactoring", "codebase-search"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
hygiene = [
    "radon>=6.0.0",
    "astroid>=3.0.0",
]
tools = [
    "pydantic-ai>=2.0.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.9.0",
    "instructor>=1.0.0",
    "openai>=1.30.0",
]
tests = [
    "hypothesis>=6.0.0",
    "tenacity>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
all = [
    "tooling-testing-kit[hygiene,tools,tests]",
]

[project.scripts]
hygiene-scan = "hygiene.scanners.run_all:main"
kit-clean-py = "clean_py.cli:main"

[tool.setuptools.packages.find]
where = [".", "plugins/python"]
include = ["hygiene*", "tools*", "tests*", "clean_py*"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["hygiene.scanners.utils"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["utils"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["_bootstrap", "control"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["_bootstrap", "control", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests/examples", "tools/test"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short ${PYTEST_EXTRA_ARGS:-}"
