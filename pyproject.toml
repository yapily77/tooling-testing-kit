[build-system]
requires = ["uv>=0.5.0"]
build-backend = "uv.build"

[project]
name = "kit"
version = "0.1.0"
description = "Portable, runnable slices of my-repo — hygiene scanner, test stubs, and dev tools for interviews and community use."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Acivar Digital" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "hypothesis>=6.165.2",
    "instructor>=1.15.4",
    "logfire>=4.40.0",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.27.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "radon>=6.0.1",
    "tenacity>=9.1.4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "hygiene",
    "tests",
    "tools",
]

[target.'kit']
dependencies = []
