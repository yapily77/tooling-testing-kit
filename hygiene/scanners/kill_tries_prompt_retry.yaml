samples: |
  ---
  Example 1: _get_age_multiplier (CC 15 -> 5) — nested if -> data-table

  BEFORE:
      def _get_age_multiplier(event_type: str, age: int | None) -> float:
          if age is None: return 1.0
          if 0 <= age < 30:
              if event_type == "education_event": return 1.3
              if event_type == "career_promotion": return 1.2
              ...
          elif 30 <= age < 50:
              ...
      # CC: 15

  AFTER:
      _AGE_MULTIPLIERS = (
          ("young", 0, 30, "education_event", 1.3),
          ...  # all 14 combinations as flat tuples
      )
      def _get_age_multiplier(event_type: str, age: int | None) -> float:
          if age is None:
              return 1.0
          for _group, low, high, etype, mult in _AGE_MULTIPLIERS:
              if low <= age < high and event_type == etype:
                  return mult
          return 1.0
      # CC: 5

  ---
  Example 2: get_phase_modifier (CC 12 -> 3) — match/case -> data-table

  BEFORE:
      def get_phase_modifier(phase: str) -> float:
          match phase:
              case 'Di Wang': return 5.0
              case 'Lin Guan': return 4.0
              ...  # 12 match arms
      # CC: 12

  AFTER:
      _PHASE_MODIFIERS: tuple[tuple[str, float], ...] = (
          ('Di Wang', 5.0), ('Lin Guan', 4.0), ...
      )
      def get_phase_modifier(phase: str) -> float:
          for name, modifier in _PHASE_MODIFIERS:
              if phase == name:
                  return modifier
          return 0.0
      # CC: 3
