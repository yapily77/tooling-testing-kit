narrative_context: |
  The intern wrote resolve_dm_strength_paradox for TARGET_REPO/engine/contradiction_resolver.py. It was meant to handle DM strength paradox resolution, which involves:
  1. Check if DM is strong or weak
  2. If weak + wealthy, check for support in Luck/Annual
  3. If support exists → wealth manageable
  4. If no support → disaster

  But the intern's approach uses sequential if/return blocks that create unnecessary nesting and inflated CC.

samples: |
  ---
  Example 1: guard clause pattern — sequential if/return → flat guard clauses

  BEFORE:
      def resolve_dm_strength_paradox(...):
          if not is_weak:
              return ContradictionResolution(...)
          if not has_wealth:
              return ContradictionResolution(...)
          support_available = luck_annual_support
          if profile and not support_available:
              da_yun = profile.da_yun_pillar
              if da_yun:
                  support_available = True
          if support_available:
              return ContradictionResolution(...)
          return ContradictionResolution(...)

  AFTER:
      def resolve_dm_strength_paradox(...):
          if not is_weak:
              return ContradictionResolution(resolved=True, winner="strong_dm", ...)
          if not has_wealth:
              return ContradictionResolution(resolved=True, winner="weak_no_wealth", ...)
          support_available = _get_support_availability(profile, luck_annual_support)
          if not support_available:
              return ContradictionResolution(resolved=True, winner="weak_no_luck_support", ...)
          return ContradictionResolution(resolved=True, winner="weak_with_luck_support", ...)

  ---
  Example 2: helper extraction — profile availability check extracted to _get_support_availability()

  BEFORE:
      support_available = luck_annual_support
      if profile and not support_available:
          da_yun = profile.da_yun_pillar
          if da_yun:
              support_available = True

  AFTER:
      def _get_support_availability(profile: ChartProfile | None, luck_annual_support: bool) -> bool:
          if luck_annual_support:
              return True
          if not profile or not profile.da_yun_pillar:
              return False
          return True

